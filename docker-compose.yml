version: "3.9"

services:
  # ─── SmartDoor API ────────────────────────────────────────────
  smartdoor-api:
    build:
      context: ./app
      dockerfile: ../docker/Dockerfile
      target: production
    image: smartdoor-api:2.0.0
    container_name: smartdoor-api
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET_KEY: "${JWT_SECRET}"
      REDIS_URL: "redis://redis:6379"
      DATABASE_URL: "postgresql://smartdoor:${DB_PASSWORD}@postgres:5432/smartdoor_db"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [smartdoor-net]
    labels:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
      prometheus.io/path: "/metrics"

  # ─── MQTT Broker (IoT Door Hardware) ─────────────────────────
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: smartdoor-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks: [smartdoor-net]

  # ─── Redis (Cache + Pub/Sub) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: smartdoor-redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [smartdoor-net]

  # ─── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: smartdoor-postgres
    environment:
      POSTGRES_DB: smartdoor_db
      POSTGRES_USER: smartdoor
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartdoor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [smartdoor-net]

  # ─── Prometheus ───────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: smartdoor-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yaml:/etc/prometheus/prometheus.yml
      - ./monitoring/alerting-rules.yaml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks: [smartdoor-net]

  # ─── Grafana ──────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: smartdoor-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/smartdoor.json
    volumes:
      - ./monitoring/grafana-dashboard.json:/etc/grafana/dashboards/smartdoor.json
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [smartdoor-net]

  # ─── Nginx API Gateway ────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: smartdoor-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [smartdoor-api]
    networks: [smartdoor-net]

volumes:
  redis_data:
  pg_data:
  prometheus_data:
  grafana_data:

networks:
  smartdoor-net:
    driver: bridge
